# BRITON SCIENCE — Message (Telegram et/ou WhatsApp) avec le crédit API restant
# Lancé à l'heure exacte deux fois par jour (07 h 41 et 19 h 41, heure d'Abidjan) par le programme Cloudflare
# « briton-reveil » (les tâches programmées de GitHub arrivaient avec plusieurs heures de retard).
# Vous pouvez aussi le lancer à tout moment : Actions > ce programme > Run workflow.
# Secrets à créer dans GitHub (Settings > Secrets and variables > Actions) :
#   ANTHROPIC_ADMIN_KEY  : clé d'administration Claude (commence par sk-ant-admin01-)
#   CREDIT_SOLDE_USD     : « Credit balance » lu dans la console Claude (ex : 18.52)
#   CREDIT_DEPENSE_MOIS  : « Spend this month » lu AU MÊME MOMENT sur la même page (ex : 0.17)
#   CREDIT_DATE          : date de ce relevé, format AAAA-MM-JJ (ex : 2026-11-27)
#   TELEGRAM_TOKEN       : jeton du robot Telegram donné par @BotFather
#   TELEGRAM_CHAT_ID     : numéro envoyé par le robot au premier message (à ajouter ensuite)
#   (plus tard, si CallMeBot rouvre) WHATSAPP_NUMERO + CALLMEBOT_APIKEY pour WhatsApp
#   (facultatif) SEUIL_ALERTE_USD : seuil d'alerte en dollars (5 par défaut)
#   (facultatif) TAUX_FCFA        : 1 dollar en FCFA (600 par défaut)
name: Crédit API sur Telegram-WhatsApp (Briton Science)

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  credit:
    runs-on: ubuntu-latest
    steps:
      - name: Calculer le crédit restant et l'envoyer
        env:
          ANTHROPIC_ADMIN_KEY: ${{ secrets.ANTHROPIC_ADMIN_KEY }}
          CREDIT_SOLDE_USD: ${{ secrets.CREDIT_SOLDE_USD }}
          CREDIT_DEPENSE_MOIS: ${{ secrets.CREDIT_DEPENSE_MOIS }}
          CREDIT_DATE: ${{ secrets.CREDIT_DATE }}
          WHATSAPP_NUMERO: ${{ secrets.WHATSAPP_NUMERO }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEUIL_ALERTE_USD: ${{ secrets.SEUIL_ALERTE_USD }}
          TAUX_FCFA: ${{ secrets.TAUX_FCFA }}
        run: |
          node --input-type=module <<'SCRIPT'
          // BRITON SCIENCE — Message (Telegram et/ou WhatsApp) : crédit API restant
          // Solde = solde lu dans la console Claude (CREDIT_SOLDE_USD)
          //         − ce qui a été dépensé depuis ce relevé.
          // Dépensé depuis le relevé = dépenses du mois du relevé jusqu'à maintenant (API Anthropic « Cost Analytics »)
          //                            − « Spend this month » lu dans la console au même moment (CREDIT_DEPENSE_MOIS).
          // Le calcul refait donc celui de la console, quelle que soit l'heure du relevé (plus de dépense comptée deux fois).
          const env = process.env;
          const nombre = v => parseFloat(String(v ?? '').replace(',', '.').replace(/[^0-9.]/g, ''));
          const ADMIN_KEY = (env.ANTHROPIC_ADMIN_KEY || '').trim();
          const SOLDE_RELEVE = nombre(env.CREDIT_SOLDE_USD);
          const DEPENSE_MOIS_RELEVE = nombre(env.CREDIT_DEPENSE_MOIS);
          const DATE_RELEVE = String(env.CREDIT_DATE || '').trim().slice(0, 10);
          const TELEPHONE = String(env.WHATSAPP_NUMERO || '').replace(/[^0-9+]/g, '');
          const CALLMEBOT_KEY = String(env.CALLMEBOT_APIKEY || '').trim();
          const TG_TOKEN = String(env.TELEGRAM_TOKEN || '').trim();
          let TG_CHAT = String(env.TELEGRAM_CHAT_ID || '').trim();
          const SEUIL = parseFloat(String(env.SEUIL_ALERTE_USD || '5').replace(',', '.')) || 5;
          const TAUX = parseFloat(String(env.TAUX_FCFA || '600').replace(',', '.')) || 600;

          const usd = n => (Math.round(n * 100) / 100).toFixed(2).replace('.', ',') + ' $';
          const fcfa = n => Math.round(n * TAUX).toLocaleString('fr-FR').replace(/ | /g, ' ') + ' FCFA';
          const H = 3600e3, J = 86400e3;
          const iso = ms => new Date(ms).toISOString().replace(/\.\d{3}Z$/, 'Z');
          const jour = ms => new Date(ms).toISOString().slice(0, 10);
          const debutJour = ms => Math.floor(ms / J) * J;
          const deux = n => String(n).padStart(2, '0');
          // Heure d'Abidjan = heure UTC
          const dateHeure = d => deux(d.getUTCDate()) + '/' + deux(d.getUTCMonth() + 1) + ' à ' + deux(d.getUTCHours()) + ' h ' + deux(d.getUTCMinutes());
          const dateCourte = s => s.slice(8, 10) + '/' + s.slice(5, 7);

          async function envoyerWhatsApp(texte) {
            const url = 'https://api.callmebot.com/whatsapp.php?phone=' + encodeURIComponent(TELEPHONE)
              + '&text=' + encodeURIComponent(texte) + '&apikey=' + encodeURIComponent(CALLMEBOT_KEY);
            const r = await fetch(url);
            const corps = await r.text();
            if (!r.ok || /apikey is invalid|invalid api ?key|wrong (api)?key|not active|phone number is not/i.test(corps.slice(0, 3000))) {
              throw new Error('Envoi WhatsApp refusé (code ' + r.status + '). Vérifiez WHATSAPP_NUMERO et CALLMEBOT_APIKEY.');
            }
          }

          async function envoyerTelegram(texte) {
            const base = 'https://api.telegram.org/bot' + TG_TOKEN;
            let note = '';
            if (!TG_CHAT) {
              // Première fois : on retrouve votre conversation avec le robot (après « Démarrer »)
              const r = await fetch(base + '/getUpdates');
              const j = await r.json().catch(() => ({}));
              if (!j.ok) throw new Error('Telegram refuse le TELEGRAM_TOKEN. Vérifiez-le.');
              const chats = (j.result || []).map(u => (u.message || u.edited_message || u.my_chat_member || {}).chat).filter(Boolean);
              if (!chats.length) throw new Error('Telegram : ouvrez votre robot, touchez « Démarrer », puis relancez le programme.');
              TG_CHAT = String(chats[chats.length - 1].id);
              note = '\n\n🔧 Dernière étape : ajoutez dans GitHub le secret TELEGRAM_CHAT_ID = ' + TG_CHAT;
            }
            const r = await fetch(base + '/sendMessage', {
              method: 'POST', headers: { 'content-type': 'application/json' },
              body: JSON.stringify({ chat_id: TG_CHAT, text: texte.replace(/\*/g, '') + note, disable_web_page_preview: true }),
            });
            const j = await r.json().catch(() => ({}));
            if (!j.ok) throw new Error('Envoi Telegram refusé. Vérifiez TELEGRAM_TOKEN et TELEGRAM_CHAT_ID.');
          }

          // ---------- Lecture des dépenses chez Anthropic ----------
          async function appelAnthropic(chemin, params, analytique) {
            const u = new URL('https://api.anthropic.com' + chemin);
            for (const [k, v] of Object.entries(params)) if (v !== undefined && v !== null) u.searchParams.set(k, v);
            const headers = { 'x-api-key': ADMIN_KEY, 'anthropic-version': analytique ? '2026-10-21' : '2023-06-01', 'user-agent': 'BritonScience-credit/2.0' };
            if (analytique) headers['anthropic-beta'] = 'analytics-usage-cost-2026-08-24';
            const r = await fetch(u, { headers });
            if (!r.ok) {
              let detail = '';
              try { const e = await r.json(); detail = String((e.error && e.error.message) || e.message || '').slice(0, 220); } catch (_) {}
              const err = new Error(r.status === 401 || r.status === 403
                ? 'Clé d\'administration refusée (code ' + r.status + '). Vérifiez ANTHROPIC_ADMIN_KEY. ' + detail
                : 'Rapport de coûts indisponible (code ' + r.status + '). ' + detail);
              err.status = r.status;
              throw err;
            }
            return r.json();
          }
          const enDollars = centimes => (parseFloat(centimes) || 0) / 100;   // Anthropic donne les montants en cents

          // Source principale : « Cost Analytics » (montants en dollars, à l'heure près, mis à jour au fil de la journée)
          const analytique = {
            maj: null,
            noter(t) { if (t && (!this.maj || t > this.maj)) this.maj = t; },
            async lire(params, ajouter) {
              let page = null, tours = 0;
              do {
                const j = await appelAnthropic('/v1/organizations/analytics/cost', { ...params, limit: '1000', page }, true);
                for (const ligne of j.data || []) ajouter(ligne);
                this.noter(j.data_refreshed_at);
                page = j.has_more ? j.next_page : null;
              } while (page && ++tours < 50);
            },
            async total(debut, fin) {          // dépense entre debut et fin (fin absente = maintenant)
              let somme = 0;
              await this.lire({ starting_at: iso(debut), ending_at: fin ? iso(fin) : undefined }, l => { somme += enDollars(l.cost && l.cost.amount); });
              return somme;
            },
            async parJour(debut, fin) {        // { 'AAAA-MM-JJ': dépense } pour des journées complètes
              const res = {};
              await this.lire({ starting_at: iso(debut), ending_at: iso(fin), time_bucket_width: '1d', order_by: 'time', order: 'asc' },
                l => { const k = String(l.starting_at).slice(0, 10); res[k] = (res[k] || 0) + enDollars(l.cost && l.cost.amount); });
              return res;
            },
          };

          // Source de secours : ancien « Cost Report » (journées complètes seulement : jusqu'à hier soir)
          const secours = {
            async parJour(debut, fin) {
              const finEffective = Math.min(fin || Infinity, debutJour(Date.now()));
              const res = {};
              if (!(finEffective > debutJour(debut))) return res;
              let page = null, tours = 0;
              do {
                const j = await appelAnthropic('/v1/organizations/cost_report',
                  { starting_at: iso(debutJour(debut)), ending_at: iso(finEffective), bucket_width: '1d', limit: '31', page }, false);
                for (const b of j.data || []) {
                  const k = String(b.starting_at).slice(0, 10);
                  for (const x of b.results || []) res[k] = (res[k] || 0) + enDollars(x.amount);
                }
                page = j.has_more ? j.next_page : null;
              } while (page && ++tours < 50);
              return res;
            },
            async total(debut, fin) { return Object.values(await this.parJour(debut, fin)).reduce((a, b) => a + b, 0); },
          };

          async function calculer(src, maintenant) {
            const aujourdhui = debutJour(maintenant);
            const [an, mois] = DATE_RELEVE.split('-').map(Number);
            // 1) Dépenses depuis le 1er du mois du relevé jusqu'à maintenant (mois par mois)
            let depuisDebutMois = 0;
            for (let i = 0, a = an, m = mois - 1; i < 14; i++) {
              const debut = Date.UTC(a, m, 1), suivant = Date.UTC(a, m + 1, 1);
              if (debut > maintenant) break;
              if (suivant <= maintenant) depuisDebutMois += await src.total(debut, suivant);
              else if (maintenant - debut >= H) depuisDebutMois += await src.total(debut, null);
              if (++m > 11) { m = 0; a++; }
            }
            // 2) Dépense du mois déjà comptée dans le solde lu dans la console
            let dejaCompte = DEPENSE_MOIS_RELEVE, approximatif = false;
            if (!(dejaCompte >= 0)) {   // secret absent : on suppose le relevé fait à 0 h le jour CREDIT_DATE
              const debutMois = Date.UTC(an, mois - 1, 1), jourReleve = Date.parse(DATE_RELEVE + 'T00:00:00Z');
              dejaCompte = jourReleve - debutMois >= H ? await src.total(debutMois, jourReleve) : 0;
              approximatif = true;
            }
            // 3) Les 7 derniers jours complets, et aujourd'hui depuis minuit
            const jours = await src.parJour(aujourdhui - 7 * J, aujourdhui);
            const auj = src === analytique && maintenant - aujourdhui >= H ? await src.total(aujourdhui, null) : null;
            return { depense: Math.max(0, depuisDebutMois - dejaCompte), jours, auj, approximatif };
          }

          async function main() {
            const manque = [];
            if (!ADMIN_KEY) manque.push('ANTHROPIC_ADMIN_KEY');
            if (!(SOLDE_RELEVE >= 0)) manque.push('CREDIT_SOLDE_USD');
            if (!/^\d{4}-\d{2}-\d{2}$/.test(DATE_RELEVE)) manque.push('CREDIT_DATE (format AAAA-MM-JJ)');
            const whatsapp = !!(TELEPHONE && CALLMEBOT_KEY);
            const telegram = !!TG_TOKEN;
            if (!whatsapp && !telegram) manque.push('TELEGRAM_TOKEN (ou bien WHATSAPP_NUMERO + CALLMEBOT_APIKEY)');
            if (manque.length) throw new Error('Secrets manquants ou incorrects : ' + manque.join(', '));

            const maintenant = Date.now();
            const aujourdhui = debutJour(maintenant);
            let texte, alerte = false;
            try {
              let r, modeSecours = false;
              try { r = await calculer(analytique, maintenant); }
              catch (e) {
                console.error('Cost Analytics indisponible (' + e.message + ') : passage au mode secours.');
                modeSecours = true;
                r = await calculer(secours, maintenant);
              }
              const solde = SOLDE_RELEVE - r.depense;
              const sept = [];
              for (let k = 7; k >= 1; k--) sept.push(r.jours[jour(aujourdhui - k * J)] || 0);
              const hier = sept[6];
              const moyenne = sept.reduce((a, b) => a + b, 0) / 7;
              const restants = moyenne > 0 ? Math.floor(Math.max(solde, 0) / moyenne) : null;
              alerte = solde < SEUIL;
              const maj = !modeSecours && analytique.maj ? new Date(analytique.maj) : null;
              const lignes = [
                '*Briton Science – Crédit API* 🤖',
                '💰 Solde : *' + usd(solde) + '* (≈ ' + fcfa(Math.max(solde, 0)) + ')',
                modeSecours ? '🕒 Mode secours : dépenses comptées jusqu\'à hier soir.'
                  : maj ? '🕒 Dépenses connues jusqu\'au ' + dateHeure(maj) + ' (heure d\'Abidjan)'
                  : '🕒 Anthropic n\'a pas encore de données pour cette période.',
                (r.auj !== null ? '📅 Aujourd\'hui : ' + usd(r.auj) + ' · ' : '📅 ') + 'Hier : ' + usd(hier),
                moyenne > 0 ? '📊 Moyenne sur 7 jours : ' + usd(moyenne) + '/jour → environ ' + restants + ' jour' + (restants > 1 ? 's' : '') + ' restant' + (restants > 1 ? 's' : '')
                            : '📊 Aucune dépense ces 7 derniers jours.',
                'ℹ️ Relevé console du ' + dateCourte(DATE_RELEVE) + ' : ' + usd(SOLDE_RELEVE)
                  + (r.approximatif ? '' : ' (dépense du mois ' + usd(DEPENSE_MOIS_RELEVE) + ')') + ' ; dépensé depuis : ' + usd(r.depense) + '.',
                r.approximatif ? '⚙️ Pour un solde exact, ajoutez le secret CREDIT_DEPENSE_MOIS (« Spend this month » lu dans la console en même temps que le solde).' : null,
                alerte ? '⚠️ *Crédit bas* (moins de ' + usd(SEUIL) + ') : rechargez sur platform.claude.com/settings/billing puis mettez à jour CREDIT_SOLDE_USD, CREDIT_DEPENSE_MOIS et CREDIT_DATE.'
                       : '✅ Tout va bien.',
              ].filter(Boolean);
              texte = lignes.join('\n');
            } catch (e) {
              alerte = true;
              texte = '*Briton Science – Crédit API* 🤖\n⚠️ Impossible de lire le crédit aujourd\'hui : ' + e.message + '\nVérifiez le solde sur platform.claude.com/settings/billing';
            }
            const erreurs = [];
            let envoyes = 0;
            if (TG_TOKEN) { try { await envoyerTelegram(texte); envoyes++; console.log('Message Telegram envoyé.'); } catch (e) { erreurs.push(e.message); } }
            if (TELEPHONE && CALLMEBOT_KEY) { try { await envoyerWhatsApp(texte); envoyes++; console.log('Message WhatsApp envoyé.'); } catch (e) { erreurs.push(e.message); } }
            if (erreurs.length) { console.error('ÉCHEC : ' + erreurs.join(' | ')); process.exitCode = 1; }
            if (envoyes && alerte) console.log('Alerte : crédit bas ou illisible.');
            // En cas d'alerte, GitHub vous envoie aussi un e-mail (exécution en échec)
            if (alerte) process.exitCode = 1;
          }

          main().catch(e => { console.error('ÉCHEC : ' + e.message); process.exitCode = 1; });
          SCRIPT

      - name: Garder ce programme actif (règle GitHub des 60 jours)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/credit-whatsapp.yml/enable" || true
